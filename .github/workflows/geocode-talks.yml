name: Geocode Talk Locations

on:
  push:
    branches: [main]
    paths:
      - '_data/cv/presentations.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Look up new locations
        run: python .github/scripts/geocode_talks.py

      - name: Commit updated coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/talk_locations.yml
          if git diff --staged --quiet; then
            echo "No new locations"
          else
            git commit -m "Geocode talk locations"
            # The CV PDF workflow may push on the same trigger
            git pull --rebase origin main
            git push
          fi
