name: Generate CV PDF

on:
  push:
    branches: [main]
    paths:
      - '_data/cv/**'
      - '_config.yml'
      - '_pages/cv-pdf-source.html'
      - '_layouts/cv-pdf-source.html'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Phone and address live in repository secrets, not in the public repo.
      # They are written to a throwaway config file used only for this build.
      - name: Write private CV contact config
        env:
          CV_PHONE: ${{ secrets.CV_PHONE }}
          CV_ADDRESS: ${{ secrets.CV_ADDRESS }}
        run: |
          if [ -z "$CV_PHONE" ] || [ -z "$CV_ADDRESS" ]; then
            echo "::warning::CV_PHONE or CV_ADDRESS secret is not set; the PDF header will omit it"
          fi
          ruby -ryaml -e 'puts({ "cv_private" => { "phone" => ENV["CV_PHONE"].to_s, "address" => ENV["CV_ADDRESS"].to_s } }.to_yaml)' > _config.cv-private.yml

      - name: Build Jekyll site
        run: bundle exec jekyll build --config _config.yml,_config.cv-private.yml

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer@latest pdf-lib

      - name: Generate PDF
        run: node .github/scripts/generate-cv-pdf.js

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/martin-gonzalez-cabello-cv.pdf
          if git diff --staged --quiet; then
            echo "No changes to PDF"
          else
            git commit -m "Auto-generate CV PDF"
            git push
          fi
